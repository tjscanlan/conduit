{{define "login"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conduit — Sign in</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-page">
<main class="login">
  <h1 class="logo">conduit</h1>
  <form method="post" action="/login" class="login-form">
    {{if .Error}}<p class="login-error" role="alert">{{.Error}}</p>{{end}}
    <input type="hidden" name="next" value="{{.Next}}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
{{end}}
