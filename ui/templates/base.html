{{define "nav"}}
<nav>
  <a class="logo" href="/traces"><img src="/static/img/logo.svg" alt="" width="26" height="26">Conduit</a>
  <a href="/traces" {{if eq .Page "traces"}}class="active"{{end}}>Traces</a>
  <a href="/logs"   {{if eq .Page "logs"}}class="active"{{end}}>Logs</a>
  <a href="/metrics"{{if eq .Page "metrics"}}class="active"{{end}}>Metrics</a>
  {{with .User}}
  <span class="nav-user" title="Signed in via {{.Source}}">{{.Name}}</span>
  {{if ne .Source "none"}}
  <form class="nav-logout" method="post" action="/logout">
    <button type="submit">Sign out</button>
  </form>
  {{end}}
  {{end}}
</nav>
{{end}}
