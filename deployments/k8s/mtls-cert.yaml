# cert-manager Certificate for the gateway mTLS server cert.
# Requires cert-manager (https://cert-manager.io) installed in the cluster.
# Adjust issuerRef to match your PKI (Vault, ACME, or self-signed CA).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: conduit-gateway-cert
  namespace: conduit
spec:
  secretName: conduit-mtls-certs
  duration: 8760h    # 1 year
  renewBefore: 720h  # renew 30 days before expiry
  subject:
    organizations:
      - AgentObs
  commonName: gateway
  dnsNames:
    - gateway
    - gateway.conduit.svc.cluster.local
  issuerRef:
    name: conduit-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# Self-signed ClusterIssuer for development.
# Replace with Vault or Let's Encrypt issuer in production.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: conduit-ca-issuer
spec:
  selfSigned: {}
