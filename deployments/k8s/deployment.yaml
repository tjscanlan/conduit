apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: conduit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/your-org/conduit-gateway:latest
          ports:
            - containerPort: 4317
          envFrom:
            - configMapRef:
                name: conduit-config
          volumeMounts:
            - name: certs
              mountPath: /etc/certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: conduit-mtls-certs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: conduit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      containers:
        - name: collector
          image: ghcr.io/your-org/conduit-collector:latest
          envFrom:
            - configMapRef:
                name: conduit-config
          env:
            - name: CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: conduit-secrets
                  key: clickhouse-dsn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: conduit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: ghcr.io/your-org/conduit-ui:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: conduit-config
          env:
            - name: CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: conduit-secrets
                  key: clickhouse-dsn
            # Login form auth. For Google Cloud IAP, see gke-iap.yaml instead.
            - name: UI_AUTH_MODE
              value: login
            - name: UI_USERS_FILE
              value: /etc/conduit/ui-users
            - name: UI_SESSION_KEY # shared by all replicas; >= 32 bytes
              valueFrom:
                secretKeyRef:
                  name: conduit-secrets
                  key: ui-session-key
          volumeMounts:
            - name: ui-users
              mountPath: /etc/conduit
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
      volumes:
        - name: ui-users
          secret:
            secretName: conduit-secrets
            items:
              - key: ui-users # lines of "username:<output of ui hash-password>"
                path: ui-users
