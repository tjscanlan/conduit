apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: conduit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/your-org/conduit-gateway:latest
          ports:
            - containerPort: 4317
          envFrom:
            - configMapRef:
                name: conduit-config
          volumeMounts:
            - name: certs
              mountPath: /etc/certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: conduit-mtls-certs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: conduit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      containers:
        - name: collector
          image: ghcr.io/your-org/conduit-collector:latest
          envFrom:
            - configMapRef:
                name: conduit-config
          env:
            - name: CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: conduit-secrets
                  key: clickhouse-dsn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: conduit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: ghcr.io/your-org/conduit-ui:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: conduit-config
          env:
            - name: CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: conduit-secrets
                  key: clickhouse-dsn
            - name: UI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: conduit-secrets
                  key: ui-api-token
