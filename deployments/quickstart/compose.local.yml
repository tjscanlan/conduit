# Build conduit-init and demo-agent from this checkout. quickstart.sh always
# adds this file, because v0.1.0 predates those two published images.
services:
  conduit-init:
    image: conduit-quickstart-init:local
    build: { context: ../.., dockerfile: deployments/quickstart/init.Dockerfile }
  demo-agent:
    image: conduit-quickstart-demo-agent:local
    build: { context: ../.., dockerfile: deployments/quickstart/demo-agent.Dockerfile }
