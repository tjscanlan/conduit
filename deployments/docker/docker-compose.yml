services:
  # ── Storage ────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.4-alpine
    ports:
      - "9000:9000"   # native protocol
      - "8123:8123"   # HTTP interface (disable in prod)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: observability
      CLICKHOUSE_USER: obs
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.99.0
    ports:
      - "8428:8428"
    volumes:
      - vm_data:/storage
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=12
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.4.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
    volumes:
      - nats_data:/data

  # ── Application ────────────────────────────────────────────────────
    restart: unless-stopped

  gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        BINARY: gateway
    ports:
      - "4317:4317"   # gRPC ingestion (mTLS)
    environment:
      GATEWAY_ADDR: ":4317"
      NATS_URL: "nats://nats:4222"
      TLS_CERT: /etc/certs/server.crt
      TLS_KEY: /etc/certs/server.key
      TLS_CA: /etc/certs/ca.crt
    volumes:
      - ../../certs:/etc/certs:ro
    depends_on: [nats]
    restart: unless-stopped
    # Scratch image: the binary probes its own /readyz.
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 12

  collector:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        BINARY: collector
    environment:
      NATS_URL: "nats://nats:4222"
      CLICKHOUSE_DSN: "clickhouse://obs:${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}@clickhouse:9000/observability"
      VICTORIAMETRICS_URL: "http://victoriametrics:8428"
      TEMPO_ENDPOINT: "http://tempo:4318"
    depends_on:
      nats: { condition: service_started }
      clickhouse: { condition: service_healthy }
      victoriametrics: { condition: service_started }
      tempo: { condition: service_started }
    restart: unless-stopped
    # Scratch image: the binary probes its own /readyz.
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 12

  ui:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        BINARY: ui
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      CLICKHOUSE_DSN: "clickhouse://obs:${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}@clickhouse:9000/observability"
      # Login form auth. Create ui-users with entries from `ui hash-password`
      # (see docs/security.md). Set UI_AUTH_MODE=none only for throwaway local use.
      UI_AUTH_MODE: ${UI_AUTH_MODE:-login}
      UI_USERS_FILE: /etc/conduit/ui-users
      UI_SESSION_KEY: ${UI_SESSION_KEY:-}
      # Local compose serves plain HTTP on localhost; never set this in production.
      UI_COOKIE_INSECURE: "true"
    volumes:
      - ./ui-users:/etc/conduit/ui-users:ro
    depends_on:
      clickhouse: { condition: service_healthy }
    restart: unless-stopped
    # Scratch image: the binary probes its own /readyz.
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  clickhouse_data:
  vm_data:
  tempo_data:
  nats_data:
