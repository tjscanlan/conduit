[project]
name = "conduit-sdk"
version = "0.2.0"
description = "Agent observability SDK: emit spans to the Conduit gateway over mTLS/gRPC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Floors match the generated stubs in src/conduit_sdk/_proto (grpcio-tools 1.85.1).
dependencies = [
    "grpcio>=1.85.1",
    "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "cryptography>=46",  # test-only: mints throwaway mTLS certificates
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conduit_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
