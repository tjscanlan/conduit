name: ci

on:
  push:
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tags are mutable).
env:
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi
      - name: release metadata is consistent
        run: scripts/release-check.sh "$(sed -n 's|^require github.com/tjscanlan/conduit \(v.*\)$|\1|p' sdk/go/go.mod)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -cover ./...
      # sdk/go is a separate module, which ./... at the root does not include.
      - name: sdk/go build, vet, test
        working-directory: sdk/go
        run: |
          go build ./...
          go vet ./...
          go test -race -cover ./...
      - name: examples/go build, vet
        working-directory: examples/go
        run: |
          go build ./...
          go vet ./...

  generated:
    name: generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: install grpcio-tools (pinned in gen-proto-python.sh)
        run: pip install "grpcio-tools==$(sed -n 's/^GRPCIO_TOOLS_VERSION=//p' scripts/gen-proto-python.sh)"
      - run: make proto roadmap api-docs
      - name: docs manifest is complete
        run: python3 scripts/build-agent-docs.py --check
      - name: check for drift
        run: |
          gen="proto/ sdk/python/src/conduit_observability/_proto/ docs/roadmap.md docs/api.md"
          if ! git diff --exit-code -- $gen; then
            echo "::error::Generated code is stale. Run 'make proto' and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- $gen)" ]; then
            echo "::error::make proto created untracked files:"; git status --porcelain -- $gen; exit 1
          fi

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]  # supported floor and newest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: install
        working-directory: sdk/python
        run: pip install -e '.[dev]'
      - name: pytest
        working-directory: sdk/python
        run: python -m pytest -q

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
      - name: govulncheck sdk/go
        working-directory: sdk/go
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
      - name: govulncheck examples/go
        working-directory: examples/go
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binary: [gateway, collector, ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker build (no push)
        run: docker build -f deployments/docker/Dockerfile --build-arg BINARY=${{ matrix.binary }} -t conduit-${{ matrix.binary }}:ci .

  smoke:
    name: compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: deployments/docker/docker-compose.yml
      # Non-default so the collector's TTL reconcile (ALTER ... MODIFY TTL) runs for real.
      SPAN_RETENTION_DAYS: "30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: install Python SDK
        run: pip install -e sdk/python
      - name: throwaway credentials and certs
        run: |
          ch_pw="$(openssl rand -hex 16)"; ui_pw="$(openssl rand -hex 16)"
          echo "::add-mask::$ch_pw"; echo "::add-mask::$ui_pw"
          { echo "CLICKHOUSE_PASSWORD=$ch_pw"; echo "UI_USER=admin"; echo "UI_PASSWORD=$ui_pw"; } >> "$GITHUB_ENV"
          printf '%s' "$ui_pw" | go run ./cmd/ui hash-password | sed 's/^/admin:/' > deployments/docker/ui-users
          ./scripts/gen-certs.sh
      - name: start stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: smoke test
        run: ./scripts/smoke-test.sh
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: tear down
        if: always()
        run: docker compose down -v

  quickstart:
    name: time to first trace (quickstart)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go is only for the "send your own trace" step; the quickstart itself needs just Docker.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: cold quickstart within the 5-minute budget
        run: ./scripts/quickstart-check.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: install the Python SDK and the examples' provider SDKs
        run: pip install -e "sdk/python[anthropic,openai]"
      # Claude and OpenAI examples run against scripts/fake-llm-server.py: no keys needed.
      - name: every example's trace reaches the UI
        run: ./scripts/examples-check.sh
      # The released images can predate UI changes, so rebuild from this checkout
      # on a fresh stack and walk the Get started flow.
      - name: fresh quickstart from source
        run: |
          ./deployments/quickstart/quickstart.sh reset
          CONDUIT_FROM_SOURCE=1 ./deployments/quickstart/quickstart.sh
      - name: Get started walkthrough
        run: ./scripts/onboarding-check.sh
      - name: logs on failure
        if: failure()
        run: docker compose -f deployments/quickstart/compose.yml logs --no-color --tail 200
      - name: tear down
        if: always()
        run: ./deployments/quickstart/quickstart.sh reset

  conduitctl:
    name: conduitctl end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # No release has these images yet, so build them all from this checkout.
      - name: build the images conduitctl runs
        run: ./scripts/build-quickstart-images.sh ci-local
      - name: build conduitctl
        run: go build -o "$RUNNER_TEMP/conduitctl" ./cmd/conduitctl
      - name: quickstart, outside the checkout
        working-directory: ${{ runner.temp }}
        run: ./conduitctl quickstart -images ci-local
      - name: doctor reports a healthy stack
        run: $RUNNER_TEMP/conduitctl doctor -images ci-local
      - name: a new agent's certificate works end to end
        run: |
          "$RUNNER_TEMP/conduitctl" agent-cert research-bot
          cd examples/go
          CONDUIT_CERT_DIR="$HOME/.conduit/quickstart/.conduit/certs" CONDUIT_AGENT=research-bot go run ./hello-trace
      - name: doctor catches a stopped gateway
        run: |
          docker compose -p conduit-quickstart stop gateway
          if "$RUNNER_TEMP/conduitctl" doctor; then echo "::error::doctor passed with the gateway stopped"; exit 1; fi
      - name: logs on failure
        if: failure()
        run: docker compose -p conduit-quickstart logs --no-color --tail 200
      - name: tear down
        if: always()
        run: $RUNNER_TEMP/conduitctl reset

