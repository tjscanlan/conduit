name: release

# Runs when a maintainer pushes a version tag. See docs/releasing.md.
# The Go SDK's sdk/go/vX.Y.Z tag has a different prefix, so it does not trigger this.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# Least privilege: each job asks only for what it needs.
permissions:
  contents: read

# Never cancel a release halfway through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to full commit SHAs (tags are mutable).
env:
  REGISTRY: ghcr.io/tjscanlan
  TAG: ${{ github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: versions, changelog and manifests agree with the tag
        run: scripts/release-check.sh "$TAG"
      - name: sdk/go tag points at the same commit
        run: |
          git fetch --no-tags origin "refs/tags/sdk/go/$TAG:refs/tags/sdk/go/$TAG" || {
            echo "::error::push sdk/go/$TAG together with $TAG"; exit 1; }
          test "$(git rev-parse "sdk/go/$TAG^{commit}")" = "$(git rev-parse "$TAG^{commit}")" || {
            echo "::error::sdk/go/$TAG and $TAG point at different commits"; exit 1; }
      - run: go test -race ./...
      - run: go test -race ./...
        working-directory: sdk/go

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signature
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway,    file: deployments/docker/Dockerfile,             args: BINARY=gateway }
          - { name: collector,  file: deployments/docker/Dockerfile,             args: BINARY=collector }
          - { name: ui,         file: deployments/docker/Dockerfile,             args: BINARY=ui }
          # The quickstart's credential generator and sample agent (conduitctl pulls these).
          - { name: init,       file: deployments/quickstart/init.Dockerfile,       args: "" }
          - { name: demo-agent, file: deployments/quickstart/demo-agent.Dockerfile, args: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Dockerfile's build stage runs on the target platform, so arm64 needs emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: image tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/conduit-${{ matrix.name }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$TAG"
            # Pre-releases never move :latest.
            case "$TAG" in *-*) ;; *) echo "$IMAGE:latest" ;; esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          provenance: mode=max
      - name: sign by digest (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/conduit-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  # conduitctl binaries, plus a SHA256SUMS file signed keylessly with cosign.
  cli:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # keyless cosign signature of SHA256SUMS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: build
        run: |
          mkdir -p cli
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}" arch="${target#*/}" ext=""
            [ "$os" = windows ] && ext=.exe
            out="$RUNNER_TEMP/conduitctl_${TAG}_${os}_${arch}"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" -o "$out/conduitctl$ext" ./cmd/conduitctl
            cp LICENSE "$out/"
            tar -C "$RUNNER_TEMP" -czf "cli/conduitctl_${TAG}_${os}_${arch}.tar.gz" "conduitctl_${TAG}_${os}_${arch}"
          done
          (cd cli && sha256sum *.tar.gz > SHA256SUMS)
          cosign sign-blob --yes --bundle cli/SHA256SUMS.sigstore.json cli/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-dist
          path: cli/
          if-no-files-found: error

  python-build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: build sdist and wheel
        working-directory: sdk/python
        run: |
          python -m pip install 'build==1.6.1' 'twine==7.0.0'
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: sdk/python/dist/
          if-no-files-found: error

  # Separate from the build so only this job, which runs no project code, can
  # mint a PyPI token. Uses trusted publishing: there is no stored credential.
  pypi:
    needs: [images, python-build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Re-running a partly failed release must not fail on files already there.
          skip-existing: true

  github-release:
    needs: [pypi, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-dist
          path: dist/
      - name: Go module resolves as a consumer would fetch it
        run: |
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          go mod init example.com/consumer
          go get "github.com/tjscanlan/conduit/sdk/go@$TAG"
          printf 'package main\n\nimport _ "github.com/tjscanlan/conduit/sdk/go"\n\nfunc main() {}\n' > main.go
          go mod tidy
          go build ./...
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-check.sh "$TAG" --notes "$RUNNER_TEMP/notes.md"
          flag=""
          case "$TAG" in *-*) flag="--prerelease" ;; esac
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" $flag
